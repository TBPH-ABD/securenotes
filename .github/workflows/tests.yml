name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the code uses `X | None` annotations.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the tool and its tests are standard library only.
      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Fail on resource leaks
        run: python -W error::ResourceWarning -m unittest discover -s tests

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # coverage.py is a CI-only dev tool. It is never shipped with the tool,
      # so the runtime stays dependency-free.
      - name: Install coverage
        run: python -m pip install --quiet coverage

      - name: Measure coverage
        run: python -m coverage run -m unittest discover -s tests

      # fail_under lives in .coveragerc, so this step enforces the threshold.
      - name: Enforce threshold
        run: python -m coverage report

  compile:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Catches syntax that the 3.10 floor does not accept.
      - name: Byte-compile everything
        run: python -m compileall -q .
